# Compiles the template on every push and pull request, and uploads the
# PDF as a build artefact. A failed run means the template no longer
# builds from a clean checkout.
name: Build PDF

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Compile main.tex with pdfLaTeX and Biber
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_lualatex: false
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error

      - name: Upload the PDF
        uses: actions/upload-artifact@v4
        with:
          name: proposal-pdf
          path: main.pdf
          if-no-files-found: error
